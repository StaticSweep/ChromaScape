name: Checkstyle and Spotless

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  session-regressions:
    # API/durable boundary coverage, not packaged worker or rendered-client proof.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sc1991
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d sc1991"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SC1991_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/sc1991
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - run: chmod +x ./gradlew
      - name: Session API and PostgreSQL regressions
        run: ./gradlew replayTest --tests 'com.chromascape.web.replay.session.*' --console=plain
      - name: Preserve test results (native worker tests require a staged package)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-regression-results
          path: |
            build/test-results/replayTest
            build/reports/tests/replayTest

  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # The canonical SC-967 vectors live in a separate private repository. Pin the
      # same committed fixture used by local verification instead of using a host path.
      - name: Require shared contracts credential
        env:
          CONTRACTS_READ_TOKEN: ${{ secrets.CONTRACTS_READ_TOKEN }}
        run: |
          if [ -z "$CONTRACTS_READ_TOKEN" ]; then
            echo "::error::Configure CONTRACTS_READ_TOKEN with read-only Contents access to ikiddoi/contracts."
            exit 1
          fi

      - name: Checkout canonical shared contracts
        uses: actions/checkout@v3
        with:
          repository: ikiddoi/contracts
          ref: 7f4fa47ea3f195ff12ca759a0c556b21fedbfc9f
          path: shared-contracts
          token: ${{ secrets.CONTRACTS_READ_TOKEN }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Spotless + Checkstyle
        run: ./gradlew check -Psc967VectorsPath=shared-contracts/sc967/ed25519-vectors.json
