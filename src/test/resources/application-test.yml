# ChromaScape Test Profile
# Portable defaults for integration tests - no Windows-only paths

spring:
  # Datasource URL, credentials, and schema are registered by
  # IsolatedPostgresTestDatabase through @DynamicPropertySource. Keeping them out of this
  # profile prevents tests from ever mutating the developer database.
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: false
    create-schemas: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      # Flyway migrates versioned tables; Hibernate may create legacy tables in this disposable
      # isolated database. It can never alter the developer database.
      ddl-auto: create-drop

server:
  port: 0

# Stabilization endpoints deliberately require separate read and write credentials outside the
# local-development profile.  Use inert test-only values so Spring integration tests exercise the
# production security configuration without requiring machine-local secrets.
stabilization:
  auth:
    token: test-stabilization-read-token
    write-token: test-stabilization-write-token

# Disable noisy subsystems during tests
overlay-broadcaster:
  enabled: false

screencapture:
  enabled: false

recording:
  enabled: false

unified-capture:
  enabled: false

tick-debugger:
  enabled: false

leeuwbot:
  integration:
    enabled: false
    stream:
      enabled: false

micro6:
  log-shipper:
    enabled: false

analysis:
  provider: codex-mcp
  mcp:
    auto-start: false
