# ChromaScape Application Configuration

spring:
  application:
    name: ChromaScape

  # Database configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/chromascape}
    username: ${SPRING_DATASOURCE_USERNAME:chromascape}
    password: ${SPRING_DATASCAPE_PASSWORD:chromascape123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

# LeeuwBot Integration Configuration
leeuwbot:
  integration:
    # Enable/disable integration with LeeuwBot API
    enabled: ${LEEUWBOT_ENABLED:true}

    # URL of the ChromaScape Bridge Service
    bridge-url: ${LEEUWBOT_BRIDGE_URL:http://localhost:8092}

    # API key for authenticating with the bridge service
    api-key: ${CHROMASCAPE_API_KEY:dev-token}

    # Heartbeat configuration
    heartbeat-interval-seconds: ${LEEUWBOT_HEARTBEAT_INTERVAL:30}

    # Connection timeouts
    connection-timeout-ms: ${LEEUWBOT_CONNECTION_TIMEOUT:5000}
    read-timeout-ms: ${LEEUWBOT_READ_TIMEOUT:10000}

    # Log forwarding
    forward-logs: ${LEEUWBOT_FORWARD_LOGS:true}
    log-batch-size: ${LEEUWBOT_LOG_BATCH_SIZE:50}
    log-flush-interval-seconds: ${LEEUWBOT_LOG_FLUSH_INTERVAL:10}

    # Script event reporting
    report-script-events: ${LEEUWBOT_REPORT_EVENTS:true}

    # Tick data forwarding to Go backend
    forward-tick-data: ${LEEUWBOT_FORWARD_TICKS:true}
    tick-forward-timeout-ms: ${LEEUWBOT_TICK_TIMEOUT:5000}
    # Use Go backend as primary storage (true = Go only, false = hybrid: local + Go)
    use-go-backend-storage: ${LEEUWBOT_USE_GO_STORAGE:false}

    # Screen streaming to Mule Service
    stream:
      # Enable screen streaming
      enabled: ${LEEUWBOT_STREAM_ENABLED:true}
      # WebSocket URL for Mule Service agent endpoint
      url: ${LEEUWBOT_STREAM_URL:ws://192.168.1.6:8084/ws/screens/agent}
      # Host identifier for grouping (e.g., "pc1", "pc2")
      host-id: ${LEEUWBOT_STREAM_HOST_ID:pc1}
      # Display name for this stream instance
      display-name: ${LEEUWBOT_STREAM_DISPLAY_NAME:ChromaScape}
      # Default FPS when streaming is requested
      fps: ${LEEUWBOT_STREAM_FPS:5}
      # JPEG quality (1-100)
      quality: ${LEEUWBOT_STREAM_QUALITY:70}
      # Stream dimensions
      width: ${LEEUWBOT_STREAM_WIDTH:800}
      height: ${LEEUWBOT_STREAM_HEIGHT:600}

# Server configuration
server:
  port: ${SERVER_PORT:8090}  # Changed from 8080 to avoid conflict with leeuwbot-api

# ChromaScape runtime configuration
chromascape:
  patchloop:
    # Execution backend: local_instance | micro6_local_executor
    execution-backend: ${CHROMASCAPE_PATCHLOOP_EXECUTION_BACKEND:micro6_local_executor}
    micro6-executor:
      # Micro6 local executor base URL for patch-loop script execution
      base-url: ${CHROMASCAPE_PATCHLOOP_MICRO6_EXECUTOR_BASE_URL:http://127.0.0.1:8098}
    # Poll interval for syncing task-plan item status from linked patch-loop iterations
    task-sync-interval-ms: ${CHROMASCAPE_PATCHLOOP_TASK_SYNC_INTERVAL_MS:5000}

# Unified Frame Capture - Single capture thread for all consumers
unified-capture:
  # Enable unified capture (reduces CPU usage by eliminating duplicate screen captures)
  enabled: ${UNIFIED_CAPTURE_ENABLED:true}
  # Frames per second for all consumers (viewport, recording, streaming)
  fps: ${UNIFIED_CAPTURE_FPS:30}

viewport-stream:
  # Target FPS for the browser viewport only (recording and other consumers still use unified-capture.fps)
  target-fps: ${VIEWPORT_STREAM_FPS:15}
  # JPEG quality for browser viewport frames
  jpeg-quality: ${VIEWPORT_STREAM_JPEG_QUALITY:70}
  # Downscale long edge before encode to reduce browser latency and payload size
  max-long-edge: ${VIEWPORT_STREAM_MAX_LONG_EDGE:960}

# Screen Capture Configuration - Continuous viewport display
screencapture:
  # Enable continuous screen capture to viewport
  enabled: ${SCREENCAPTURE_ENABLED:true}
  # Frames per second to capture (1-60, default 15)
  # DEPRECATED: Use unified-capture.fps instead (this is kept for backward compatibility)
  fps: ${SCREENCAPTURE_FPS:15}
  # Only capture when game window is focused (optional feature)
  capture-only-when-focused: ${SCREENCAPTURE_FOCUSED_ONLY:false}
  # Minimum seconds between error logs (rate limiting, default 5)
  error-log-interval-seconds: ${SCREENCAPTURE_ERROR_LOG_INTERVAL:5}

# Game Recording Configuration - For replay functionality
recording:
  # Enable recording functionality
  enabled: ${RECORDING_ENABLED:true}
  # Directory where recordings are stored
  output-directory: ${RECORDING_OUTPUT_DIR:recordings}
  # Video quality (1-100, higher = better quality)
  video-quality: ${RECORDING_QUALITY:75}
  # Frames per second for recording
  # DEPRECATED: Use unified-capture.fps instead (this is kept for backward compatibility)
  fps: ${RECORDING_FPS:15}
  # Record audio (not currently supported)
  record-audio: ${RECORDING_AUDIO:false}
  # Maximum recording duration in minutes (0 = unlimited)
  max-duration-minutes: ${RECORDING_MAX_DURATION:60}
  # Video encoding preset (veryfast, fast, medium, slow, slower, veryslow)
  encoding-preset: ${RECORDING_ENCODING_PRESET:veryfast}
  # Automatically record when game starts
  auto-record: ${RECORDING_AUTO:false}

# Tick Debugger Configuration - For tick-based debugging
tick-debugger:
  # Enable tick debugger functionality
  enabled: ${TICK_DEBUGGER_ENABLED:true}
  # Retention period for debug sessions (days)
  retention-days: ${TICK_DEBUGGER_RETENTION_DAYS:7}
  # WebSocket configuration
  websocket:
    # Maximum message size in bytes
    max-message-size: ${TICK_DEBUGGER_WS_MAX_SIZE:1048576}
  # Batch insert size for performance
  batch-insert-size: ${TICK_DEBUGGER_BATCH_SIZE:100}
  # Tick duration in milliseconds (RuneScape standard)
  tick-duration-ms: ${TICK_DEBUGGER_TICK_DURATION:600}

# Micro6 Integration Configuration
micro6:
  log-shipper:
    # Enable/disable log file shipper
    enabled: ${MICRO6_LOG_SHIPPER_ENABLED:false}
    # Path to micro6 client log file (absolute path)
    log-file-path: ${MICRO6_LOG_FILE_PATH:}
    # Source identifier for shipped logs
    source-name: ${MICRO6_SOURCE_NAME:micro6-shipper}
    # Polling interval in milliseconds
    polling-interval-ms: ${MICRO6_POLLING_MS:5000}
    # Maximum logs per batch
    max-batch-size: ${MICRO6_MAX_BATCH:100}
    # Maximum deduplication history
    max-history-lines: ${MICRO6_HISTORY_LINES:500}
  executor-catalog:
    # Enable/disable catalog fetch from local executor
    enabled: ${MICRO6_EXECUTOR_CATALOG_ENABLED:true}
    # Micro6 local executor base URL
    base-url: ${MICRO6_EXECUTOR_BASE_URL:http://127.0.0.1:8098}
    # HTTP timeout for catalog fetch
    timeout-ms: ${MICRO6_EXECUTOR_TIMEOUT_MS:5000}
    # Cache TTL in seconds
    refresh-seconds: ${MICRO6_EXECUTOR_CATALOG_REFRESH_SECONDS:30}

# Analysis Provider Configuration - For BMAD (Bot Metric Analysis & Diagnostics)
analysis:
  # Provider selection: claude-api, codex-mcp, claude-mcp (legacy alias), or openai-codex
  # Set via ANALYSIS_PROVIDER environment variable
  # Default is codex-mcp for auto-start convenience
  provider: ${ANALYSIS_PROVIDER:codex-mcp}

  # MCP-specific configuration (used when provider is codex-mcp or claude-mcp)
  mcp:
    # Auto-start configuration
    auto-start: ${MCP_AUTO_START:true}
    bridge-directory: ${MCP_BRIDGE_DIR:scripts/mcp-bridge}
    startup-timeout: ${MCP_STARTUP_TIMEOUT:30}

    # MCP server URL
    server-url: ${MCP_SERVER_URL:http://localhost:8765}
    # Request timeout in seconds
    timeout-seconds: ${MCP_TIMEOUT:120}
    # Maximum retry attempts
    max-retries: ${MCP_MAX_RETRIES:3}

  # OpenAI/Codex API configuration (used when provider is openai-codex)
  openai:
    # OpenAI API key (set via ANALYSIS_OPENAI_API_KEY environment variable)
    api-key: ${ANALYSIS_OPENAI_API_KEY:}
    # OpenAI Chat Completions endpoint URL
    url: ${ANALYSIS_OPENAI_URL:https://api.openai.com/v1/chat/completions}
    # Model to use for analysis (gpt-5-mini, gpt-4.1, etc.)
    model: ${ANALYSIS_OPENAI_MODEL:gpt-5-mini}
    # Request timeout in seconds
    timeout-seconds: ${ANALYSIS_OPENAI_TIMEOUT:120}
    # Maximum tokens in API response
    max-tokens: ${ANALYSIS_OPENAI_MAX_TOKENS:8192}

# Claude API Configuration - For BMAD (Bot Metric Analysis & Diagnostics)
# Only used when analysis.provider=claude-api
claude:
  api:
    # Claude API key (set via CLAUDE_API_KEY environment variable)
    key: ${CLAUDE_API_KEY:}
    # Claude API endpoint URL
    url: ${CLAUDE_API_URL:https://api.anthropic.com/v1/messages}
    # Model to use for analysis (claude-opus-4-6, claude-sonnet-4-5, etc.)
    model: ${CLAUDE_API_MODEL:claude-opus-4-6}
    # Request timeout in seconds
    timeout-seconds: ${CLAUDE_API_TIMEOUT:120}
    # Maximum tokens in API response
    max-tokens: ${CLAUDE_API_MAX_TOKENS:4096}

# Microbot Agent Server Configuration
microbot:
  agent-server:
    # Enable/disable Microbot Agent Server adapter
    enabled: ${MICROBOT_AGENT_SERVER_ENABLED:false}
    # Base URL of the Microbot Agent Server
    base-url: ${MICROBOT_AGENT_SERVER_URL:http://localhost:8085}
    # HTTP request timeout in milliseconds
    timeout-ms: ${MICROBOT_AGENT_SERVER_TIMEOUT:5000}
    # Polling interval for state snapshots in milliseconds
    poll-interval-ms: ${MICROBOT_AGENT_SERVER_POLL_MS:2000}

# Feature Flags
features:
  task-synthesis:
    enabled: ${FEATURES_TASK_SYNTHESIS_ENABLED:true}
  patch-loop:
    autofix-enabled: ${FEATURES_PATCH_LOOP_AUTOFIX:true}
  ai-player:
    enabled: ${FEATURES_AI_PLAYER_ENABLED:false}
    shadow-mode: ${FEATURES_AI_PLAYER_SHADOW:false}
    control-enabled: ${FEATURES_AI_PLAYER_CONTROL:false}

# AI Player Configuration
ai-player:
  dataset:
    output-dir: ${AI_PLAYER_DATASET_DIR:.chromascape/datasets}

# Simulator Verifier Integration Configuration
simulator:
  verifier:
    # Enable/disable simulator verifier integration
    enabled: ${SIMULATOR_VERIFIER_ENABLED:true}

    # Root directory of the OpenRune-Server project
    openrune-root: ${SIMULATOR_OPENRUNE_ROOT:F:\\Dev\\IdeaProjects\\OpenRune-Server}

    # Gradle command to execute (relative to openrune-root)
    gradle-cmd: ${SIMULATOR_GRADLE_CMD:gradlew.bat}

    # Invocation mode: jar (default) or gradle (fallback)
    invocation-mode: ${SIMULATOR_INVOCATION_MODE:jar}

    # Verifier jar path (relative to openrune-root if not absolute)
    verifier-jar-path: ${SIMULATOR_VERIFIER_JAR:simulator-verifier/build/libs/simulator-verifier-all.jar}

    # Default bridge URL for fetching the latest deterministic session
    default-bridge-url: ${SIMULATOR_DEFAULT_BRIDGE_URL:http://localhost:8092}

    # API key for authenticating with the bridge service
    api-key: ${CHROMASCAPE_API_KEY:dev-token}

    # Directory where simulator verification reports will be stored
    reports-dir: ${SIMULATOR_REPORTS_DIR:output/simulator-reports}

    # Maximum number of concurrent verification jobs allowed
    max-concurrent-jobs: ${SIMULATOR_MAX_CONCURRENT_JOBS:2}

    # Maximum time (in seconds) a verification job is allowed to run
    job-timeout-seconds: ${SIMULATOR_JOB_TIMEOUT:300}

    # Automatically create the reports directory if it doesn't exist
    auto-create-reports-dir: ${SIMULATOR_AUTO_CREATE_DIR:true}

  # Replay Control - Proxy to OpenRune HTTP API for in-game playback control
  replay-control:
    enabled: ${SIMULATOR_REPLAY_CONTROL_ENABLED:true}
    openrune-api-url: ${SIMULATOR_REPLAY_API_URL:http://127.0.0.1:8195}
    api-key: ${SIMULATOR_REPLAY_API_KEY:dev-token}
    connection-timeout-ms: ${SIMULATOR_REPLAY_CONNECTION_TIMEOUT:5000}
    read-timeout-ms: ${SIMULATOR_REPLAY_READ_TIMEOUT:10000}
