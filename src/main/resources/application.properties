spring.application.name=ChromaScape
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/chromascape}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chromascape}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:chromascape123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# SC-1430 decide-only provider runtime. Disabled by default with no gameplay or delivery
# capability; enable only with operator authentication and a >=32 character operator key.
gameplay.provider-runtime.enabled=${GAMEPLAY_PROVIDER_RUNTIME_ENABLED:false}
gameplay.provider-runtime.operator-key=${GAMEPLAY_PROVIDER_RUNTIME_OPERATOR_KEY:}
gameplay.provider-runtime.work-root=${GAMEPLAY_PROVIDER_RUNTIME_WORK_ROOT:.chromascape/provider-runtime-work}
gameplay.provider-runtime.transcript-root=${GAMEPLAY_PROVIDER_TRANSCRIPT_ROOT:.chromascape/provider-transcripts}
gameplay.provider-runtime.max-stdout-bytes=${GAMEPLAY_PROVIDER_MAX_STDOUT_BYTES:1048576}
gameplay.provider-runtime.max-stderr-bytes=${GAMEPLAY_PROVIDER_MAX_STDERR_BYTES:131072}
gameplay.provider-runtime.process-start-timeout-millis=${GAMEPLAY_PROVIDER_PROCESS_START_TIMEOUT_MS:5000}
gameplay.provider-runtime.first-event-timeout-millis=${GAMEPLAY_PROVIDER_FIRST_EVENT_TIMEOUT_MS:30000}
gameplay.provider-runtime.tool-response-timeout-millis=${GAMEPLAY_PROVIDER_TOOL_RESPONSE_TIMEOUT_MS:5000}
gameplay.provider-runtime.claude.command[0]=${GAMEPLAY_PROVIDER_CLAUDE_COMMAND:claude}
gameplay.provider-runtime.claude.allowed-models[0]=claude-*
gameplay.provider-runtime.claude.allowed-models[1]=sonnet
gameplay.provider-runtime.claude.allowed-models[2]=opus
gameplay.provider-runtime.claude.credential-environment-names[0]=ANTHROPIC_API_KEY
gameplay.provider-runtime.codex.command[0]=${GAMEPLAY_PROVIDER_CODEX_COMMAND:codex}
gameplay.provider-runtime.codex.allowed-models[0]=gpt-*
gameplay.provider-runtime.codex.allowed-models[1]=o3
gameplay.provider-runtime.codex.allowed-models[2]=o4-*
gameplay.provider-runtime.codex.credential-environment-names[0]=OPENAI_API_KEY

# SC-1431 source-neutral AccountBuilder orchestration. Disabled by default with no delivery
# capability; HELD/SHADOW never dispatch. Enable only with a >=32 character operator key.
gameplay.accountbuilder-orchestration.enabled=${GAMEPLAY_ACCOUNTBUILDER_ORCHESTRATION_ENABLED:false}
gameplay.accountbuilder-orchestration.live-delivery-enabled=${GAMEPLAY_ACCOUNTBUILDER_LIVE_DELIVERY_ENABLED:false}
gameplay.accountbuilder-orchestration.operator-key=${GAMEPLAY_ACCOUNTBUILDER_ORCHESTRATION_OPERATOR_KEY:}
