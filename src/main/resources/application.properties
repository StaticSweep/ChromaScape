spring.application.name=ChromaScape
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/chromascape}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chromascape}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:chromascape123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
