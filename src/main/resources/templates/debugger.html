<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <title>ChromaScape - Debugger</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPgv6ud+Mvd" crossorigin="anonymous" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/debugger.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>
  <div class="debugger-page">
    <nav class="debugger-topbar">
      <div class="topbar-section topbar-left">
        <span class="navbar-brand h1 d-flex align-items-center gap-2">
          <img src="/imagesWeb/CS.png" alt="ChromaScape logo" class="brand-logo" />
          ChromaScape Debugger
        </span>
        <div class="dropdown">
          <button class="btn btn-primary dropdown-toggle" type="button" id="windowSelectorDropdown"
            data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-window me-1"></i><span id="selectedWindowLabel">Auto-detect</span>
          </button>
          <ul class="dropdown-menu" aria-labelledby="windowSelectorDropdown" id="windowList">
            <li>
              <h6 class="dropdown-header">Select Window</h6>
            </li>
            <li><a class="dropdown-item" href="#" data-window-id="" onclick="selectWindow('')">
                <i class="bi bi-magic me-2"></i>Auto-detect
              </a></li>
            <li>
              <hr class="dropdown-divider">
            </li>
          </ul>
        </div>
        <div class="session-controls">
          <select id="sessionSelect" class="form-select" aria-label="Select recording session">
            <option value="">Loading sessions...</option>
          </select>
          <button id="refreshSessionsBtn" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-clockwise me-1"></i>Refresh
          </button>
        </div>
      </div>

      <div class="topbar-section mode-controls">
        <div class="btn-group" role="group" aria-label="Debugger mode">
          <button type="button" class="btn btn-outline-primary active" id="liveModeBtn">
            <i class="bi bi-broadcast me-2"></i>Live
          </button>
          <button type="button" class="btn btn-outline-primary" id="replayModeBtn">
            <i class="bi bi-play-circle me-2"></i>Replay
          </button>
        </div>
      </div>

      <div class="topbar-section tick-controls">
        <div class="tick-readout" id="tickDisplay">Tick --</div>
        <div class="tick-jump">
          <input id="tickJumpInput" type="number" min="0" class="form-control form-control-sm"
            placeholder="Jump" />
          <button id="tickJumpBtn" class="btn btn-outline-primary btn-sm">Go</button>
        </div>
        <button type="button" class="btn btn-primary" onclick="window.location.href='/'">
          <i class="bi bi-house-fill me-1"></i>Dashboard
        </button>
      </div>
    </nav>

    <div class="debugger-container">
      <section class="debugger-main">
        <div class="viewport-panel glass-panel">
          <h5><i class="bi bi-eye me-2"></i>Viewport</h5>
          <div class="viewport-stage" id="viewportStage">
            <div id="viewport-loader" class="loader-container">
              <div class="glass-loader"></div>
              <div class="loader-text">Waiting for visual input...</div>
            </div>
            <img id="viewport-image" class="img-fluid" alt="Live viewport" />
            <video id="replayVideo" controls class="border border-secondary rounded">
              <source src="" type="video/mp4">
              Your browser does not support the video tag.
            </video>
            <canvas id="overlay-canvas"></canvas>
          </div>
        </div>

        <div class="logs-panel glass-panel">
          <div class="logs-header">
            <h5><i class="bi bi-terminal me-2"></i>Logs</h5>
            <div class="log-controls">
              <div class="btn-group btn-group-sm" role="group" aria-label="Log level filter">
                <button type="button" class="btn btn-outline-secondary active" data-level="all">All</button>
                <button type="button" class="btn btn-outline-secondary" data-level="ERROR">Err</button>
                <button type="button" class="btn btn-outline-secondary" data-level="WARN">Wrn</button>
              </div>
              <div class="log-search">
                <input id="logSearchInput" class="form-control form-control-sm" type="text" placeholder="Search" />
                <button id="logSearchBtn" class="btn btn-outline-secondary btn-sm">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>
          </div>
          <div id="logsContainer" class="console-output">
            <div class="text-muted fst-italic">Waiting for logs...</div>
          </div>
        </div>
      </section>

      <section class="scrubber-bar glass-panel">
        <div class="scrubber-track">
          <input id="scrubberRange" type="range" min="0" max="100" value="0" />
          <div class="scrubber-meta">
            <span id="scrubberTimecode">--:-- / --:--</span>
            <span id="scrubberMode">Live</span>
          </div>
        </div>
        <div class="scrubber-controls">
          <button id="scrubberPrevBtn" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-skip-backward"></i>
          </button>
          <button id="scrubberPlayBtn" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-play-fill"></i>
          </button>
          <button id="scrubberNextBtn" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-skip-forward"></i>
          </button>
          <select id="scrubberSpeed" class="form-select form-select-sm">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
          </select>
        </div>
      </section>

      <section class="debugger-bottom">
        <div class="bot-state-panel glass-panel">
          <h5><i class="bi bi-cpu me-2"></i>Bot State</h5>
          <div id="botStateContent" class="state-grid">
            <div class="text-muted fst-italic">Awaiting bot state...</div>
          </div>
        </div>
        <div class="ai-inspector-panel glass-panel">
          <h5><i class="bi bi-lightbulb me-2"></i>AI Inspector</h5>
          <div id="aiInspectorContent" class="ai-card">
            <div class="text-muted fst-italic">Scanning for anomalies...</div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="/js/debugger.js"></script>
</body>

</html>
