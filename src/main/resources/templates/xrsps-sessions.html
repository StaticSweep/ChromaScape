<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>xRSPS Sessions · ChromaScape</title>
<style>body{font:16px system-ui;background:#101923;color:#e8eef4;max-width:1000px;margin:40px auto;padding:20px}label{display:block;margin:16px 0 6px}input,select,button{font:inherit;padding:10px;border-radius:6px;border:1px solid #738595}button{cursor:pointer;margin:8px 4px 8px 0}input{background:#f4f7fa;color:#101923}fieldset{margin:20px 0;border:1px solid #42566b;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#192735;padding:16px}a{color:#8bceff}.controls{display:flex;flex-wrap:wrap;gap:4px}button:disabled{opacity:.5}</style></head>
<body><h1>xRSPS sessions</h1><p>Run a published recording or a bounded AI task in an isolated game world. The game viewer follows the committed session.</p>
<form id="create"><label for="scenario">Published scenario ID</label><input id="scenario" required size="42" placeholder="Published manifest UUID"><label for="mode">Execution mode</label><select id="mode"><option value="RECORDED_ACTIONS">Recording</option><option value="AI_TASK">AI task</option></select><button>Create session</button></form>
<fieldset><legend>Session</legend><label for="session">Session ID</label><input id="session" size="42"><button id="connect">Reconnect</button><a id="viewer" hidden target="_blank" rel="noopener">Open game viewer</a>
<div class="controls"><button id="play">Run recording</button><button data-command="pause">Pause</button><button data-command="resume">Resume</button><button data-command="step-run">Single tick</button><button data-command="cancel">Stop</button><button data-command="recover">Recover checkpoint</button></div>
<label for="seek">Seek to a verified tick</label><input id="seek" type="number" min="0" max="10000" value="0"><button id="seek-button">Seek</button></fieldset>
<fieldset><legend>AI Fishing task</legend><label for="provider">Configured provider</label><select id="provider"><option>CODEX</option><option>CLAUDE</option></select><label for="model">Allowlisted model</label><input id="model" required><label for="level">Target Fishing level</label><input id="level" type="number" min="2" max="99" value="2"><label for="ticks">Tick budget</label><input id="ticks" type="number" min="1" max="10000" value="100"><label for="seconds">Time budget (seconds)</label><input id="seconds" type="number" min="30" max="3600" value="600"><button id="ai">Run AI task</button></fieldset>
<p id="notice" role="status" aria-live="polite">Select a published scenario to begin.</p><pre id="state">No session selected.</pre><script src="/js/xrsps-sessions.js"></script></body></html>
