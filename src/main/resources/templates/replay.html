<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Replay - ChromaScape</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .video-container {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }
        video {
            width: 100%;
            max-height: 600px;
            display: block;
        }
        .timeline-container {
            position: relative;
            margin: 10px 0;
        }
        .timeline-slider {
            width: 100%;
            cursor: pointer;
        }
        .log-panel {
            max-height: 300px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        .log-entry {
            padding: 5px 10px;
            margin: 2px 0;
            border-radius: 4px;
            border-left: 3px solid #555;
        }
        .log-entry.debug {
            border-left-color: #6c757d;
            background: rgba(108, 117, 125, 0.1);
        }
        .log-entry.info {
            border-left-color: #0d6efd;
            background: rgba(13, 110, 253, 0.1);
        }
        .log-entry.warn {
            border-left-color: #ffc107;
            background: rgba(255, 193, 7, 0.1);
        }
        .log-entry.error {
            border-left-color: #dc3545;
            background: rgba(220, 53, 69, 0.1);
        }
        .log-timestamp {
            color: #888;
            font-size: 11px;
        }
        .control-btn {
            min-width: 100px;
        }
        .recording-item {
            cursor: pointer;
            transition: background 0.2s;
        }
        .recording-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .time-display {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: bold;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container-fluid p-4">
        <div class="row">
            <div class="col-12">
                <h2><i class="bi bi-play-circle me-2"></i>Game Replay</h2>
            </div>
        </div>

        <!-- Recording Controls -->
        <div class="row">
            <div class="col-12">
                <div class="glass-panel">
                    <div class="row align-items-center">
                        <div class="col-auto">
                            <button id="recordBtn" class="btn btn-danger control-btn">
                                <i class="bi bi-circle-fill me-1"></i>
                                <span id="recordBtnText">Start Recording</span>
                            </button>
                        </div>
                        <div class="col-auto">
                            <button id="refreshBtn" class="btn btn-outline-light control-btn">
                                <i class="bi bi-arrow-clockwise me-1"></i>
                                Refresh List
                            </button>
                        </div>
                        <div class="col-auto ms-auto">
                            <span id="recordingStatus" class="badge bg-secondary">Not Recording</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Video Player -->
        <div class="row" id="playerSection" style="display:none;">
            <div class="col-lg-8">
                <div class="glass-panel">
                    <div class="video-container">
                        <video id="videoPlayer" controls>
                            Your browser does not support video playback.
                        </video>
                    </div>
                    <div class="timeline-container mt-3">
                        <input type="range" id="timelineSlider" class="form-range timeline-slider" min="0" max="100" value="0" step="0.1">
                        <div class="row align-items-center mt-2">
                            <div class="col-auto">
                                <button id="playPauseBtn" class="btn btn-primary">
                                    <i class="bi bi-pause-fill"></i>
                                </button>
                            </div>
                            <div class="col-auto">
                                <div class="time-display">
                                    <span id="currentTime">00:00</span> / <span id="duration">00:00</span>
                                </div>
                            </div>
                            <div class="col-auto">
                                <select id="playbackSpeed" class="form-select form-select-sm" style="width: auto;">
                                    <option value="0.25">0.25x</option>
                                    <option value="0.5">0.5x</option>
                                    <option value="1" selected>1x</option>
                                    <option value="2">2x</option>
                                    <option value="4">4x</option>
                                </select>
                            </div>
                            <div class="col-auto ms-auto">
                                <button id="fullscreenBtn" class="btn btn-outline-light">
                                    <i class="bi bi-fullscreen"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Logs Panel -->
            <div class="col-lg-4">
                <div class="glass-panel">
                    <h6><i class="bi bi-file-text me-2"></i>Synchronized Logs</h6>
                    <div class="mb-2">
                        <input type="text" id="logSearch" class="form-control form-control-sm" placeholder="Search logs...">
                    </div>
                    <div class="mb-2">
                        <select id="logLevelFilter" class="form-select form-select-sm">
                            <option value="all">All Levels</option>
                            <option value="debug">Debug</option>
                            <option value="info">Info</option>
                            <option value="warn">Warning</option>
                            <option value="error">Error</option>
                        </select>
                    </div>
                    <div id="logPanel" class="log-panel">
                        <div class="text-center text-muted p-3">
                            No logs available for this recording
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recordings List -->
        <div class="row">
            <div class="col-12">
                <div class="glass-panel">
                    <h6><i class="bi bi-collection-play me-2"></i>Available Recordings</h6>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover">
                            <thead>
                                <tr>
                                    <th>Recording ID</th>
                                    <th>Date</th>
                                    <th>Duration</th>
                                    <th>Size</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="recordingsList">
                                <tr>
                                    <td colspan="5" class="text-center">No recordings found</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = '/api/recordings';
        let isRecording = false;
        let currentRecording = null;

        // DOM Elements
        const recordBtn = document.getElementById('recordBtn');
        const recordBtnText = document.getElementById('recordBtnText');
        const refreshBtn = document.getElementById('refreshBtn');
        const recordingStatus = document.getElementById('recordingStatus');
        const videoPlayer = document.getElementById('videoPlayer');
        const playerSection = document.getElementById('playerSection');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const timelineSlider = document.getElementById('timelineSlider');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const playbackSpeed = document.getElementById('playbackSpeed');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const logPanel = document.getElementById('logPanel');
        const logSearch = document.getElementById('logSearch');
        const logLevelFilter = document.getElementById('logLevelFilter');
        const recordingsList = document.getElementById('recordingsList');

        // Recording Controls
        recordBtn.addEventListener('click', async () => {
            if (isRecording) {
                await stopRecording();
            } else {
                await startRecording();
            }
        });

        refreshBtn.addEventListener('click', loadRecordings);

        async function startRecording() {
            try {
                const response = await fetch(`${API_BASE}/start`, { method: 'POST' });
                const data = await response.json();

                if (data.status === 'recording') {
                    isRecording = true;
                    currentRecording = data.recordingId;
                    recordBtn.classList.remove('btn-danger');
                    recordBtn.classList.add('btn-success');
                    recordBtnText.textContent = 'Stop Recording';
                    recordingStatus.textContent = 'Recording...';
                    recordingStatus.classList.remove('bg-secondary');
                    recordingStatus.classList.add('bg-danger');
                }
            } catch (error) {
                console.error('Failed to start recording:', error);
            }
        }

        async function stopRecording() {
            try {
                const response = await fetch(`${API_BASE}/stop`, { method: 'POST' });
                const data = await response.json();

                if (data.status === 'stopped') {
                    isRecording = false;
                    recordBtn.classList.remove('btn-success');
                    recordBtn.classList.add('btn-danger');
                    recordBtnText.textContent = 'Start Recording';
                    recordingStatus.textContent = 'Not Recording';
                    recordingStatus.classList.remove('bg-danger');
                    recordingStatus.classList.add('bg-secondary');

                    // Refresh the list
                    await loadRecordings();
                }
            } catch (error) {
                console.error('Failed to stop recording:', error);
            }
        }

        // Load Recordings List
        async function loadRecordings() {
            try {
                const response = await fetch(`${API_BASE}/list`);
                const recordings = await response.json();

                if (recordings.length === 0) {
                    recordingsList.innerHTML = '<tr><td colspan="5" class="text-center">No recordings found</td></tr>';
                    return;
                }

                recordingsList.innerHTML = recordings.map(r => `
                    <tr class="recording-item" data-id="${r.id}" data-url="${r.url}">
                        <td><code>${r.id}</code></td>
                        <td>${new Date(r.lastModified).toLocaleString()}</td>
                        <td>${formatSize(r.size)}</td>
                        <td>
                            <button class="btn btn-sm btn-primary play-recording" data-url="${r.url}">
                                <i class="bi bi-play-fill"></i> Play
                            </button>
                            <button class="btn btn-sm btn-outline-danger delete-recording" data-id="${r.id}">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');

                // Add play button listeners
                document.querySelectorAll('.play-recording').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const url = btn.dataset.url;
                        loadRecording(url);
                    });
                });
            } catch (error) {
                console.error('Failed to load recordings:', error);
            }
        }

        function loadRecording(url) {
            videoPlayer.src = url;
            playerSection.style.display = 'block';
            playerSection.scrollIntoView({ behavior: 'smooth' });
            videoPlayer.play();
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Video Player Controls
        playPauseBtn.addEventListener('click', () => {
            if (videoPlayer.paused) {
                videoPlayer.play();
                playPauseBtn.innerHTML = '<i class="bi bi-pause-fill"></i>';
            } else {
                videoPlayer.pause();
                playPauseBtn.innerHTML = '<i class="bi bi-play-fill"></i>';
            }
        });

        videoPlayer.addEventListener('timeupdate', () => {
            const percent = (videoPlayer.currentTime / videoPlayer.duration) * 100;
            timelineSlider.value = percent;
            currentTimeEl.textContent = formatTime(videoPlayer.currentTime);
        });

        videoPlayer.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(videoPlayer.duration);
        });

        timelineSlider.addEventListener('input', () => {
            const time = (timelineSlider.value / 100) * videoPlayer.duration;
            videoPlayer.currentTime = time;
        });

        playbackSpeed.addEventListener('change', () => {
            videoPlayer.playbackRate = parseFloat(playbackSpeed.value);
        });

        fullscreenBtn.addEventListener('click', () => {
            if (videoPlayer.requestFullscreen) {
                videoPlayer.requestFullscreen();
            }
        });

        // Load recordings on page load
        loadRecordings();

        // Simulated logs (TODO: Connect to real log API)
        const sampleLogs = [
            { level: 'info', time: 0, message: 'Recording started' },
            { level: 'debug', time: 2, message: 'Player position updated: (100, 200)' },
            { level: 'info', time: 5, message: 'Task started: Fishing' },
            { level: 'debug', time: 8, message: 'Found fishing spot' },
            { level: 'info', time: 10, message: 'Casting fishing rod...' },
        ];

        function displayLogs(logs) {
            logPanel.innerHTML = logs.map(log => `
                <div class="log-entry ${log.level}" data-time="${log.time}">
                    <div class="log-timestamp">[${formatTime(log.time)}]</div>
                    <div>${log.message}</div>
                </div>
            `).join('');
        }

        displayLogs(sampleLogs);
    </script>
</body>
</html>
